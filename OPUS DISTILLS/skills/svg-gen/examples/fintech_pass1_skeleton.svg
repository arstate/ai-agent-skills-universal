<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4000 4000" width="4000" height="4000" style="max-width:100%;height:auto;display:block;background:#FFFFFF;">
  <g id="pass1-clean-silhouettes">
    <!-- Icon 01: Digital Wallet & Payment Cards -->
    <g id="p1-wallet" transform="translate(1100, 1100)">
      <!-- Banknote Silhouette -->
      <path id="p1-w-cash" fill="#10B981" d="M -363.86,-337.04 L 105.65,-436.84 L 163.86,-162.96 L -305.65,-63.16 Z" />
      <!-- Credit Card Silhouette -->
      <path id="p1-w-card" fill="#2563EB" d="M -115.20,-414.63 L 399.74,-342.26 L 355.20,-25.37 L -159.74,-97.74 Z" />
      <!-- Wallet Body -->
      <path id="p1-w-body" fill="#1E293B" d="M -376.00,-40.00 H 376.00 A 44.00,44.00 0 0 1 420.00,4.00 V 456.00 A 44.00,44.00 0 0 1 376.00,500.00 H -376.00 A 44.00,44.00 0 0 1 -420.00,456.00 V 4.00 A 44.00,44.00 0 0 1 -376.00,-40.00 Z" />
      <!-- Pocket Section -->
      <path id="p1-w-pocket" fill="#0F172A" d="M -376.00,140.00 H 376.00 A 44.00,44.00 0 0 1 420.00,184.00 V 456.00 A 44.00,44.00 0 0 1 376.00,500.00 H -376.00 A 44.00,44.00 0 0 1 -420.00,456.00 V 184.00 A 44.00,44.00 0 0 1 -376.00,140.00 Z" />
      <!-- Clasp Snap Tab -->
      <path id="p1-w-clasp" fill="#F59E0B" d="M 334.00,300.00 A 46.00,46.00 0 1 0 426.00,300.00 A 46.00,46.00 0 1 0 334.00,300.00 Z" />
    </g>

    <!-- Icon 02: Neoclassical Bank / Financial Institution -->
    <g id="p1-bank" transform="translate(2900, 1100)">
      <!-- Triangular Pediment -->
      <path id="p1-b-pediment" fill="#2563EB" d="M 0.00,-520.00 L 520.00,-180.00 H -520.00 Z" />
      <!-- Entablature Beam -->
      <path id="p1-b-beam" fill="#1D4ED8" d="M -472.00,-180.00 H 472.00 A 8.00,8.00 0 0 1 480.00,-172.00 V -118.00 A 8.00,8.00 0 0 1 472.00,-110.00 H -472.00 A 8.00,8.00 0 0 1 -480.00,-118.00 V -172.00 A 8.00,8.00 0 0 1 -472.00,-180.00 Z" />
      <!-- 4 Columns -->
      <path id="p1-b-columns" fill="#2563EB" d="M -380.00,-110.00 H -300.00 V 320.00 H -380.00 Z M -160.00,-110.00 H -80.00 V 320.00 H -160.00 Z M 80.00,-110.00 H 160.00 V 320.00 H 80.00 Z M 300.00,-110.00 H 380.00 V 320.00 H 300.00 Z" />
      <!-- Arched Portal Door -->
      <path id="p1-b-door" fill="#0F172A" d="M -80.00,320.00 V 130.00 A 80.00,80.00 0 0 1 80.00,130.00 V 320.00 Z" />
      <!-- Stepped Stylobate Foundation -->
      <path id="p1-b-steps" fill="#0F172A" d="M -530.00,320.00 H 530.00 A 10.00,10.00 0 0 1 540.00,330.00 V 450.00 A 10.00,10.00 0 0 1 530.00,460.00 H -530.00 A 10.00,10.00 0 0 1 -540.00,450.00 V 330.00 A 10.00,10.00 0 0 1 -530.00,320.00 Z" />
    </g>

    <!-- Icon 03: Mobile Contactless Payment Smartphone -->
    <g id="p1-phone" transform="translate(1100, 2900)">
      <!-- Chassis Body -->
      <path id="p1-p-chassis" fill="#0F172A" d="M -250.00,-520.00 H 250.00 A 60.00,60.00 0 0 1 310.00,-460.00 V 460.00 A 60.00,60.00 0 0 1 250.00,520.00 H -250.00 A 60.00,60.00 0 0 1 -310.00,460.00 V -460.00 A 60.00,60.00 0 0 1 -250.00,-520.00 Z" />
      <!-- Screen Display -->
      <path id="p1-p-screen" fill="#F8FAFC" d="M -231.00,-485.00 H 231.00 A 44.00,44.00 0 0 1 275.00,-441.00 V 441.00 A 44.00,44.00 0 0 1 231.00,485.00 H -231.00 A 44.00,44.00 0 0 1 -275.00,441.00 V -441.00 A 44.00,44.00 0 0 1 -231.00,-485.00 Z" />
      <!-- Virtual Card Header -->
      <path id="p1-p-card" fill="#2563EB" d="M -186.00,-370.00 H 186.00 A 24.00,24.00 0 0 1 210.00,-346.00 V -184.00 A 24.00,24.00 0 0 1 186.00,-160.00 H -186.00 A 24.00,24.00 0 0 1 -210.00,-184.00 V -346.00 A 24.00,24.00 0 0 1 -186.00,-370.00 Z" />
      <!-- Verified Badge Disc -->
      <path id="p1-p-badge" fill="#10B981" d="M -110.00,35.00 A 110.00,110.00 0 1 0 110.00,35.00 A 110.00,110.00 0 1 0 -110.00,35.00 Z" />
      <!-- Action CTA Pill Button -->
      <path id="p1-p-cta" fill="#2563EB" d="M -182.00,290.00 H 182.00 A 28.00,28.00 0 0 1 210.00,318.00 V 346.00 A 28.00,28.00 0 0 1 182.00,374.00 H -182.00 A 28.00,28.00 0 0 1 -210.00,346.00 V 318.00 A 28.00,28.00 0 0 1 -182.00,290.00 Z" />
    </g>

    <!-- Icon 04: Growth Analytics & Investment Chart -->
    <g id="p1-analytics" transform="translate(2900, 2900)">
      <!-- Datum Base Plinth -->
      <path id="p1-c-base" fill="#0F172A" d="M -502.00,400.00 H 502.00 A 18.00,18.00 0 0 1 520.00,418.00 V 462.00 A 18.00,18.00 0 0 1 502.00,480.00 H -502.00 A 18.00,18.00 0 0 1 -520.00,462.00 V 418.00 A 18.00,18.00 0 0 1 -502.00,400.00 Z" />
      <!-- 4 Ascending Volume Bars -->
      <path id="p1-c-bars" fill="#2563EB" d="M -400.00,220.00 H -300.00 V 400.00 H -400.00 Z M -200.00,70.00 H -100.00 V 400.00 H -200.00 Z M 0.00,-80.00 H 100.00 V 400.00 H 0.00 Z M 200.00,-250.00 H 300.00 V 400.00 H 200.00 Z" />
      <!-- Ascending Trend Spline Arrow -->
      <path id="p1-c-arrow" fill="#0284C7" d="M -350.00,160.00 L -150.00,10.00 L 50.00,-140.00 L 250.00,-300.00 L 370.00,-390.00 L 310.00,-390.00 L 350.00,-350.00 L 230.00,-240.00 L 30.00,-80.00 L -170.00,70.00 Z" />
    </g>
  </g>
</svg>